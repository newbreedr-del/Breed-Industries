    <text x="540" y="500" font-size="80" font-weight="800" fill="#FFFFFF" letter-spacing="-2">PACKAGE.</text>
    <text x="540" y="610" font-size="46" font-weight="700" fill="#D4AF37">PAY FOR EXACTLY</text>
