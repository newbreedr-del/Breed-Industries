<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="amber12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5A835"/>
      <stop offset="100%" stop-color="#9B6310"/>
    </linearGradient>
    <symbol id="bm12" viewBox="-110 -110 220 220">
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#F8F5F0"/>
      <g fill="#1A1A1B">
        <rect x="-55" y="-50" width="110" height="22"/>
        <rect x="33" y="-28" width="22" height="20"/>
        <rect x="-55" y="-8" width="110" height="16"/>
        <rect x="-55" y="8" width="22" height="20"/>
        <rect x="-55" y="28" width="110" height="22"/>
      </g>
    </symbol>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg12)"/>

  <!-- Top -->
  <g transform="translate(540, 160)">
    <use href="#bm12" width="60" height="60" x="-30" y="-30"/>
  </g>
  <text x="540" y="290" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="14" letter-spacing="6" fill="#CA8114" font-weight="700">EVERYTHING UNDER ONE ROOF</text>

  <!-- Headline -->
  <g font-family="Montserrat, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="380" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Four pillars.</text>
    <text x="540" y="450" font-size="58" font-weight="800" fill="url(#amber12)" letter-spacing="-1.5">Built to compound.</text>
  </g>

  <!-- Pillar stack -->
  <g font-family="Montserrat, Arial, sans-serif">
    <g transform="translate(60, 540)">
      <rect width="960" height="200" rx="16" fill="#242426" stroke="#CA8114" stroke-width="1"/>
      <text x="40" y="80" font-size="60" font-weight="800" fill="url(#amber12)">01</text>
      <text x="160" y="65" font-size="28" font-weight="800" fill="#FFFFFF">SETUP</text>
      <text x="160" y="105" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.7">CIPC · SARS · BEE · CSD · Bank Setup</text>
      <text x="160" y="140" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.5">Get legal, get listed, get on the system.</text>
      <text x="920" y="100" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#CA8114">From R550</text>
    </g>
    <g transform="translate(60, 760)">
      <rect width="960" height="200" rx="16" fill="#242426" stroke="#CA8114" stroke-width="1"/>
      <text x="40" y="80" font-size="60" font-weight="800" fill="url(#amber12)">02</text>
      <text x="160" y="65" font-size="28" font-weight="800" fill="#FFFFFF">BRAND</text>
      <text x="160" y="105" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.7">Logo · Identity · Cards · Flyers · Media Kit</text>
      <text x="160" y="140" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.5">A real brand — not a Canva template.</text>
      <text x="920" y="100" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#CA8114">From R1,500</text>
    </g>
    <g transform="translate(60, 980)">
      <rect width="960" height="200" rx="16" fill="#242426" stroke="#CA8114" stroke-width="1"/>
      <text x="40" y="80" font-size="60" font-weight="800" fill="url(#amber12)">03</text>
      <text x="160" y="65" font-size="28" font-weight="800" fill="#FFFFFF">PROFILE</text>
      <text x="160" y="105" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.7">Plans · Profiles · Funding Decks · Training</text>
      <text x="160" y="140" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.5">The paperwork that opens doors and unlocks funding.</text>
      <text x="920" y="100" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#CA8114">From R850</text>
    </g>
    <g transform="translate(60, 1200)">
      <rect width="960" height="200" rx="16" fill="url(#amber12)"/>
      <text x="40" y="80" font-size="60" font-weight="800" fill="#1A1A1B">04</text>
      <text x="160" y="65" font-size="28" font-weight="800" fill="#1A1A1B">DIGITAL</text>
      <text x="160" y="105" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1A1A1B" opacity="0.85">Websites · Apps · E-commerce · AI</text>
      <text x="160" y="140" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1B" opacity="0.65">The digital product that prints money while you sleep.</text>
      <text x="920" y="100" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#1A1A1B">From R5,000</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(540, 1540)">
    <rect x="-340" y="-55" width="680" height="110" rx="55" fill="url(#amber12)"/>
    <text y="14" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="800" fill="#1A1A1B" letter-spacing="3">BUILD MY PACKAGE  →</text>
  </g>

  <!-- Footer -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="540" y="1730" font-size="32" font-weight="700" fill="#CA8114">thebreed.co.za/build-package</text>
    <text x="540" y="1780" font-size="20" opacity="0.7">Pay for exactly what you need.</text>
    <text x="540" y="1850" font-size="18" opacity="0.5" letter-spacing="3">@breedindustries</text>
  </g>
</svg>
