<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#001A36"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4D77A"/>
      <stop offset="100%" stop-color="#A6841F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sgrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#sbg)"/>
  <rect width="1080" height="1920" fill="url(#sgrid)"/>
  <ellipse cx="540" cy="800" rx="700" ry="500" fill="url(#halo)"/>

  <!-- Top brand tag -->
  <g transform="translate(540, 250)">
    <text text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="20" letter-spacing="8" fill="#D4AF37" font-weight="700">JUST LAUNCHED</text>
    <line x1="-150" y1="20" x2="-30" y2="20" stroke="#D4AF37" stroke-width="1"/>
    <line x1="30" y1="20" x2="150" y2="20" stroke="#D4AF37" stroke-width="1"/>
  </g>

  <!-- Hero -->
  <g font-family="Montserrat, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="500" font-size="100" font-weight="800" fill="#FFFFFF" letter-spacing="-3">THE NEW</text>
    <text x="540" y="620" font-size="100" font-weight="800" fill="#FFFFFF" letter-spacing="-3">HOME OF</text>
    <text x="540" y="780" font-size="180" font-weight="800" fill="url(#sg)" letter-spacing="-6">BREED.</text>
  </g>

  <!-- Body -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="540" y="900" font-size="34" font-weight="600" opacity="0.9">One platform.</text>
    <text x="540" y="950" font-size="34" font-weight="600" opacity="0.9">Every service you need.</text>
    <text x="540" y="1000" font-size="34" font-weight="600" opacity="0.9">Zero ceiling.</text>
  </g>

  <!-- Feature pills -->
  <g font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="600" fill="#001F3F" text-anchor="middle">
    <g transform="translate(270, 1130)">
      <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#D4AF37"/>
      <text y="8" letter-spacing="3">PACKAGE BUILDER</text>
    </g>
    <g transform="translate(810, 1130)">
      <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#D4AF37"/>
      <text y="8" letter-spacing="3">LIVE QUOTES</text>
    </g>
    <g transform="translate(270, 1230)">
      <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#FFFFFF"/>
      <text y="8" letter-spacing="3">CLIENT PORTAL</text>
    </g>
    <g transform="translate(810, 1230)">
      <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#FFFFFF"/>
      <text y="8" letter-spacing="3">PORTFOLIO</text>
    </g>
  </g>

  <!-- Big CTA -->
  <g transform="translate(540, 1500)">
    <rect x="-330" y="-55" width="660" height="110" rx="55" fill="url(#sg)"/>
    <text y="14" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="32" font-weight="800" fill="#001F3F" letter-spacing="3">VISIT THE BREED →</text>
  </g>

  <!-- Footer -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="540" y="1730" font-size="34" font-weight="700" fill="#D4AF37">thebreed.co.za</text>
    <text x="540" y="1780" font-size="22" opacity="0.7">@breedindustries  ·  +27 60 496 4105</text>
    <text x="540" y="1830" font-size="18" opacity="0.5" letter-spacing="3">SWIPE UP TO EXPLORE</text>
  </g>
</svg>
