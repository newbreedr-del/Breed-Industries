  <!-- Package 2: Growth Momentum (FEATURED) -->
  <g transform="translate(380, 260)" font-family="Montserrat, Arial, sans-serif">
    <rect width="320" height="760" rx="20" fill="url(#amber7)"/>
    <text x="160" y="55" text-anchor="middle" font-size="12" letter-spacing="4" fill="#1A1A1B" font-weight="800">★ MOST POPULAR ★</text>
