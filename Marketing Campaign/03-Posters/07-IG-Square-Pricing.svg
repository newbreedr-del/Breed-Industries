    <text x="160" y="195" text-anchor="middle" font-size="14" font-family="Inter,Arial,sans-serif" fill="#FFFFFF" opacity="0.55">From</text>
    <text x="160" y="245" text-anchor="middle" font-size="46" font-weight="800" fill="url(#amber7)">R3,950</text>

    <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">
