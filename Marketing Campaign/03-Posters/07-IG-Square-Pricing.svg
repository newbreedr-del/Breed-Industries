<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1B"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="amber7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5A835"/>
      <stop offset="100%" stop-color="#9B6310"/>
    </linearGradient>
    <symbol id="bm7" viewBox="-110 -110 220 220">
