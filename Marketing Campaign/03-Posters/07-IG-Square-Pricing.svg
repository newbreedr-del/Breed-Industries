    <g transform="translate(40, 600)">
      <rect width="240" height="56" rx="28" fill="none" stroke="#CA8114" stroke-width="1.5"/>
      <text x="120" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#CA8114" letter-spacing="2">CHOOSE EMPIRE</text>
