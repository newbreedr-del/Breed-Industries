    <text x="160" y="555" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.4" font-style="italic">Perfect for new businesses</text>

    <g transform="translate(40, 600)">
      <rect width="240" height="56" rx="28" fill="none" stroke="#CA8114" stroke-width="1.5"/>
      <text x="120" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#CA8114" letter-spacing="2">CHOOSE LAUNCH</text>
    </g>
