<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="pricebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="goldp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4D77A"/>
      <stop offset="100%" stop-color="#A6841F"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#pricebg)"/>

  <text x="540" y="120" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#D4AF37" font-weight="700">PICK YOUR LANE</text>
  <text x="540" y="180" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">Three packages. One mission.</text>

  <!-- Package 1 -->
  <g transform="translate(60, 270)" font-family="Montserrat, Arial, sans-serif">
    <rect width="320" height="700" rx="20" fill="#0A1A2F" stroke="#D4AF37" stroke-width="1"/>
    <text x="160" y="60" text-anchor="middle" font-size="14" letter-spacing="4" fill="#D4AF37" font-weight="700">LAUNCH</text>
    <text x="160" y="110" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">STARTER</text>
    <line x1="60" y1="135" x2="260" y2="135" stroke="#D4AF37" opacity="0.4"/>
    <text x="160" y="200" text-anchor="middle" font-size="44" font-weight="800" fill="url(#goldp)">R2 500</text>
    <text x="160" y="232" text-anchor="middle" font-size="14" font-family="Inter,Arial,sans-serif" fill="#FFFFFF" opacity="0.5">to R4 500</text>

    <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">
      <text x="40" y="305">✓  CIPC Registration</text>
      <text x="40" y="345">✓  Basic Logo Design</text>
      <text x="40" y="385">✓  Business Cards</text>
      <text x="40" y="425">✓  Single Poster/Flyer</text>
      <text x="40" y="465">✓  Quick-start Brand Kit</text>
    </g>

    <g transform="translate(40, 600)">
      <rect width="240" height="56" rx="28" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="120" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#D4AF37" letter-spacing="2">CHOOSE LAUNCH</text>
    </g>
  </g>

  <!-- Package 2 (featured) -->
  <g transform="translate(380, 240)" font-family="Montserrat, Arial, sans-serif">
    <rect width="320" height="760" rx="20" fill="url(#goldp)"/>
    <text x="160" y="60" text-anchor="middle" font-size="14" letter-spacing="4" fill="#001F3F" font-weight="700">MOST POPULAR</text>
    <text x="160" y="110" text-anchor="middle" font-size="32" font-weight="800" fill="#001F3F">GROWTH</text>
    <text x="160" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#001F3F">PROFESSIONAL</text>
    <line x1="60" y1="170" x2="260" y2="170" stroke="#001F3F" opacity="0.3"/>
    <text x="160" y="240" text-anchor="middle" font-size="44" font-weight="800" fill="#001F3F">R6 000</text>
    <text x="160" y="272" text-anchor="middle" font-size="14" font-family="Inter,Arial,sans-serif" fill="#001F3F" opacity="0.7">to R10 000</text>

    <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#001F3F">
      <text x="40" y="345">✓  Everything in Launch</text>
      <text x="40" y="385">✓  Premium Logo + Identity</text>
      <text x="40" y="425">✓  5-10 Page Website</text>
      <text x="40" y="465">✓  Custom App Build</text>
      <text x="40" y="505">✓  Social Setup</text>
      <text x="40" y="545">✓  Business Plan or Profile</text>
    </g>

    <g transform="translate(40, 660)">
      <rect width="240" height="56" rx="28" fill="#001F3F"/>
      <text x="120" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#D4AF37" letter-spacing="2">CHOOSE GROWTH</text>
    </g>
  </g>

  <!-- Package 3 -->
  <g transform="translate(700, 270)" font-family="Montserrat, Arial, sans-serif">
    <rect width="320" height="700" rx="20" fill="#0A1A2F" stroke="#D4AF37" stroke-width="1"/>
    <text x="160" y="60" text-anchor="middle" font-size="14" letter-spacing="4" fill="#D4AF37" font-weight="700">EMPIRE</text>
    <text x="160" y="110" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">PREMIUM</text>
    <line x1="60" y1="135" x2="260" y2="135" stroke="#D4AF37" opacity="0.4"/>
    <text x="160" y="200" text-anchor="middle" font-size="44" font-weight="800" fill="url(#goldp)">R12 000</text>
    <text x="160" y="232" text-anchor="middle" font-size="14" font-family="Inter,Arial,sans-serif" fill="#FFFFFF" opacity="0.5">to R25 000+</text>

    <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.85">
      <text x="40" y="305">✓  Everything in Growth</text>
      <text x="40" y="345">✓  Web Portal or App</text>
      <text x="40" y="385">✓  60-sec Video Ad</text>
      <text x="40" y="425">✓  Full Media Kit</text>
      <text x="40" y="465">✓  3 Months Social Mgmt</text>
      <text x="40" y="505">✓  Compliance Add-ons</text>
    </g>

    <g transform="translate(40, 600)">
      <rect width="240" height="56" rx="28" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="120" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#D4AF37" letter-spacing="2">CHOOSE EMPIRE</text>
    </g>
  </g>

  <text x="540" y="1030" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#FFFFFF" opacity="0.6">Or build your own at thebreed.co.za/build-package · @breedindustries</text>
</svg>
