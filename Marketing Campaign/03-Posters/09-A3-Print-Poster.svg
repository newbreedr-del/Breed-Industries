<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" width="2480" height="3508">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="agold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4D77A"/>
      <stop offset="100%" stop-color="#A6841F"/>
    </linearGradient>
    <radialGradient id="aglow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="2480" height="3508" fill="url(#abg)"/>
  <rect width="2480" height="3508" fill="url(#agrid)"/>
  <ellipse cx="1240" cy="1400" rx="1500" ry="1100" fill="url(#aglow)"/>

  <!-- Border -->
  <rect x="80" y="80" width="2320" height="3348" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.5"/>
  <rect x="120" y="120" width="2240" height="3268" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>

  <!-- Top brand bar -->
  <g transform="translate(1240, 280)" font-family="Montserrat, Arial, sans-serif" text-anchor="middle">
    <text font-size="34" letter-spacing="14" fill="#D4AF37" font-weight="700">THE BREED INDUSTRIES</text>
    <text y="60" font-size="20" letter-spacing="8" fill="#FFFFFF" opacity="0.7" font-weight="500">PREMIUM GROWTH AGENCY · DURBAN, SOUTH AFRICA</text>
  </g>

  <!-- Hero -->
  <g transform="translate(1240, 800)" font-family="Montserrat, Arial, sans-serif" text-anchor="middle">
    <text font-size="180" font-weight="800" fill="#FFFFFF" letter-spacing="-6">FROM IDEA</text>
    <text y="200" font-size="180" font-weight="800" fill="#FFFFFF" letter-spacing="-6">TO</text>
    <text y="430" font-size="280" font-weight="800" fill="url(#agold)" letter-spacing="-10">EMPIRE.</text>
  </g>

  <!-- Divider -->
  <g transform="translate(1240, 1700)">
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#D4AF37" stroke-width="2"/>
  </g>

  <!-- 4 service blocks -->
  <g transform="translate(220, 1820)" font-family="Montserrat, Arial, sans-serif">
    <g>
      <rect width="500" height="500" rx="20" fill="#0A1A2F" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="250" y="120" text-anchor="middle" font-size="100" font-weight="800" fill="url(#agold)">01</text>
      <text x="250" y="220" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF">BUSINESS SETUP</text>
      <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFFFFF" opacity="0.7" text-anchor="middle">
        <text x="250" y="290">CIPC Registration</text>
        <text x="250" y="330">SARS &amp; Tax Clearance</text>
        <text x="250" y="370">B-BBEE Certification</text>
        <text x="250" y="410">CSD &amp; Bank Accounts</text>
      </g>
    </g>
    <g transform="translate(540, 0)">
      <rect width="500" height="500" rx="20" fill="#0A1A2F" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="250" y="120" text-anchor="middle" font-size="100" font-weight="800" fill="url(#agold)">02</text>
      <text x="250" y="220" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF">BRANDING</text>
      <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFFFFF" opacity="0.7" text-anchor="middle">
        <text x="250" y="290">Logo &amp; Identity</text>
        <text x="250" y="330">Business Cards</text>
        <text x="250" y="370">Letterheads &amp; Flyers</text>
        <text x="250" y="410">Full Media Kits</text>
      </g>
    </g>
    <g transform="translate(1080, 0)">
      <rect width="500" height="500" rx="20" fill="#0A1A2F" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="250" y="120" text-anchor="middle" font-size="100" font-weight="800" fill="url(#agold)">03</text>
      <text x="250" y="220" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF">PLANS &amp; PROFILES</text>
      <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFFFFF" opacity="0.7" text-anchor="middle">
        <text x="250" y="290">Business Plans</text>
        <text x="250" y="330">Financial Projections</text>
        <text x="250" y="370">Company Profiles</text>
        <text x="250" y="410">Funding Proposals</text>
      </g>
    </g>
    <g transform="translate(1620, 0)">
      <rect width="500" height="500" rx="20" fill="url(#agold)"/>
      <text x="250" y="120" text-anchor="middle" font-size="100" font-weight="800" fill="#001F3F">04</text>
      <text x="250" y="220" text-anchor="middle" font-size="36" font-weight="800" fill="#001F3F">DIGITAL</text>
      <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#001F3F" opacity="0.85" text-anchor="middle">
        <text x="250" y="290">Websites &amp; Web Apps</text>
        <text x="250" y="330">Mobile Applications</text>
        <text x="250" y="370">E-Commerce Stores</text>
        <text x="250" y="410">AI &amp; Custom Platforms</text>
      </g>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(1240, 2580)">
    <rect x="-700" y="-100" width="1400" height="200" rx="100" fill="url(#agold)"/>
    <text text-anchor="middle" y="40" font-family="Montserrat, Arial, sans-serif" font-size="80" font-weight="800" fill="#001F3F" letter-spacing="6">START YOUR EMPIRE  →</text>
  </g>

  <!-- QR placeholder -->
  <g transform="translate(220, 2900)">
    <rect width="280" height="280" fill="#FFFFFF"/>
    <g fill="#001F3F">
      <rect x="20" y="20" width="60" height="60"/>
      <rect x="200" y="20" width="60" height="60"/>
      <rect x="20" y="200" width="60" height="60"/>
      <rect x="100" y="100" width="20" height="20"/>
      <rect x="140" y="100" width="20" height="20"/>
      <rect x="180" y="140" width="20" height="20"/>
      <rect x="100" y="180" width="40" height="20"/>
      <rect x="160" y="200" width="20" height="40"/>
      <rect x="220" y="180" width="20" height="20"/>
      <rect x="120" y="220" width="20" height="20"/>
    </g>
    <text x="140" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.7">Scan to start</text>
  </g>

  <!-- Contact -->
  <g transform="translate(560, 2960)" font-family="Montserrat, Arial, sans-serif" fill="#FFFFFF">
    <text font-size="34" font-weight="700" fill="#D4AF37" letter-spacing="3">www.thebreed.co.za</text>
    <text y="60" font-family="Inter, Arial, sans-serif" font-size="26" opacity="0.85">info@thebreed.co.za  ·  +27 60 496 4105</text>
    <text y="105" font-family="Inter, Arial, sans-serif" font-size="22" opacity="0.65">Instagram &amp; TikTok: @breedindustries</text>
    <text y="140" font-family="Inter, Arial, sans-serif" font-size="22" opacity="0.65">Facebook: BREEDinc  ·  LinkedIn: Breed Industries</text>
    <text y="195" font-family="Inter, Arial, sans-serif" font-size="20" opacity="0.5">Trusted by GoBizz · I-Group · MC Ways · NSPIRAXION · Lance · Gadali · and more.</text>
  </g>
</svg>
