  <line x1="0" y1="970" x2="1080" y2="970" stroke="#CA8114" stroke-width="1" opacity="0.4"/>
  <text x="540" y="1010" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="800" fill="url(#amber2)" letter-spacing="3">BUILD YOUR PACKAGE TODAY</text>
  <text x="540" y="1045" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.6">www.thebreed.co.za/build-package  ·  @breedindustries</text>
