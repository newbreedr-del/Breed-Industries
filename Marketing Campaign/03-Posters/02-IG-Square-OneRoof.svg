  <text x="106" y="62" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="5">BREED</text>
  <text x="106" y="84" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="600" fill="#CA8114" letter-spacing="5">INDUSTRIES</text>
