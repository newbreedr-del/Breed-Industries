<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="amber11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5A835"/>
      <stop offset="100%" stop-color="#9B6310"/>
    </linearGradient>
    <pattern id="hg11" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#CA8114" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <symbol id="bm11" viewBox="-110 -110 220 220">
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#F8F5F0"/>
      <g fill="#1A1A1B">
        <rect x="-55" y="-50" width="110" height="22"/>
        <rect x="33" y="-28" width="22" height="20"/>
        <rect x="-55" y="-8" width="110" height="16"/>
        <rect x="-55" y="8" width="22" height="20"/>
        <rect x="-55" y="28" width="110" height="22"/>
      </g>
    </symbol>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg11)"/>
  <rect width="1080" height="1080" fill="url(#hg11)"/>

  <!-- Top -->
  <g transform="translate(540, 90)">
    <use href="#bm11" width="44" height="44" x="-22" y="-22"/>
  </g>
  <text x="540" y="180" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="14" letter-spacing="6" fill="#CA8114" font-weight="700">BY THE NUMBERS</text>
  <text x="540" y="240" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Real Work. Real Impact.</text>

  <!-- Stats grid 2x2 -->
  <g font-family="Montserrat, Arial, sans-serif">
    <g transform="translate(60, 320)">
      <rect width="470" height="320" rx="18" fill="#242426" stroke="#CA8114" stroke-width="1"/>
      <text x="40" y="180" font-size="180" font-weight="800" fill="url(#amber11)">23+</text>
      <line x1="40" y1="220" x2="120" y2="220" stroke="#CA8114" stroke-width="3"/>
      <text x="40" y="260" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="3">CLIENTS SERVED</text>
      <text x="40" y="290" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.6">Across South Africa</text>
    </g>
    <g transform="translate(550, 320)">
      <rect width="470" height="320" rx="18" fill="url(#amber11)"/>
      <text x="40" y="180" font-size="180" font-weight="800" fill="#1A1A1B">5</text>
      <line x1="40" y1="220" x2="120" y2="220" stroke="#1A1A1B" stroke-width="3"/>
      <text x="40" y="260" font-size="20" font-weight="800" fill="#1A1A1B" letter-spacing="3">DIGITAL PRODUCTS</text>
      <text x="40" y="290" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1B" opacity="0.7">From AI platforms to e-commerce</text>
    </g>
    <g transform="translate(60, 660)">
      <rect width="470" height="320" rx="18" fill="url(#amber11)"/>
      <text x="40" y="180" font-size="180" font-weight="800" fill="#1A1A1B">8+</text>
      <line x1="40" y1="220" x2="120" y2="220" stroke="#1A1A1B" stroke-width="3"/>
      <text x="40" y="260" font-size="20" font-weight="800" fill="#1A1A1B" letter-spacing="3">BRAND IDENTITIES</text>
      <text x="40" y="290" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1A1A1B" opacity="0.7">Designed and launched</text>
    </g>
    <g transform="translate(550, 660)">
      <rect width="470" height="320" rx="18" fill="#242426" stroke="#CA8114" stroke-width="1"/>
      <text x="40" y="180" font-size="180" font-weight="800" fill="url(#amber11)">45+</text>
      <line x1="40" y1="220" x2="120" y2="220" stroke="#CA8114" stroke-width="3"/>
      <text x="40" y="260" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="3">BUSINESSES LAUNCHED</text>
      <text x="40" y="290" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.6">From idea to operating</text>
    </g>
  </g>

  <text x="540" y="1040" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#FFFFFF" opacity="0.55">Become the next number → www.thebreed.co.za  ·  @breedindustries</text>
</svg>
