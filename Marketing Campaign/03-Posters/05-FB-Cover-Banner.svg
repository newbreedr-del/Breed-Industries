<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="60%" stop-color="#001A36"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4D77A"/>
      <stop offset="100%" stop-color="#A6841F"/>
    </linearGradient>
    <pattern id="fgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#D4AF37" stroke-width="0.4" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="820" height="312" fill="url(#fbg)"/>
  <rect width="820" height="312" fill="url(#fgrid)"/>
  <circle cx="700" cy="156" r="180" fill="#D4AF37" opacity="0.06"/>

  <g transform="translate(50, 80)" font-family="Montserrat, Arial, sans-serif">
    <text font-size="13" letter-spacing="6" fill="#D4AF37" font-weight="700">PREMIUM GROWTH AGENCY · DURBAN</text>
    <text y="55" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">From Idea to Empire.</text>
    <text y="100" font-size="18" font-weight="500" fill="#FFFFFF" opacity="0.7">We register, brand, and build for ambitious South African entrepreneurs.</text>
    <g transform="translate(0, 130)">
      <rect width="200" height="44" rx="22" fill="url(#fg)"/>
      <text x="100" y="29" text-anchor="middle" font-size="14" font-weight="800" fill="#001F3F" letter-spacing="2">START YOUR EMPIRE →</text>
    </g>
  </g>

  <g transform="translate(620, 156)">
    <circle r="100" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>
    <circle r="70" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
    <circle r="40" fill="url(#fg)"/>
    <text y="6" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="800" fill="#001F3F">BREED</text>
  </g>
