<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EDE6D6"/>
    </linearGradient>
    <linearGradient id="amber8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CA8114"/>
      <stop offset="100%" stop-color="#9B6310"/>
    </linearGradient>
    <symbol id="bm8" viewBox="-110 -110 220 220">
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#1A1A1B"/>
      <g fill="#F8F5F0">
        <rect x="-55" y="-50" width="110" height="22"/>
        <rect x="33" y="-28" width="22" height="20"/>
        <rect x="-55" y="-8" width="110" height="16"/>
        <rect x="-55" y="8" width="22" height="20"/>
        <rect x="-55" y="28" width="110" height="22"/>
      </g>
    </symbol>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg8)"/>

  <!-- Big quote mark -->
  <text x="100" y="320" font-family="Georgia, serif" font-size="320" fill="#CA8114" opacity="0.22" font-weight="700">"</text>

  <!-- Logo -->
  <g transform="translate(95, 130)">
    <use href="#bm8" width="60" height="60" x="-30" y="-30"/>
  </g>

  <!-- Quote -->
  <g font-family="Montserrat, Arial, sans-serif" fill="#1A1A1B">
    <text x="100" y="430" font-size="44" font-weight="700" letter-spacing="-1">They didn't just register</text>
    <text x="100" y="486" font-size="44" font-weight="700" letter-spacing="-1">my company — they built</text>
    <text x="100" y="542" font-size="44" font-weight="700" letter-spacing="-1">the whole engine.</text>
    <text x="100" y="598" font-size="44" font-weight="700" letter-spacing="-1">Logo, website, profile,</text>
    <text x="100" y="654" font-size="44" font-weight="700" letter-spacing="-1">and a system that runs</text>
    <text x="100" y="710" font-size="44" font-weight="700" letter-spacing="-1">while I sleep.</text>
  </g>

  <!-- Attribution -->
  <g transform="translate(100, 820)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="url(#amber8)" stroke-width="3"/>
    <text y="44" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="800" fill="#1A1A1B" letter-spacing="2">FOUNDER, I-GROUP</text>
    <text y="76" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1A1A1B" opacity="0.6">Built with The Breed</text>
  </g>

  <!-- Star rating -->
  <g transform="translate(820, 860)">
    <text font-family="Arial" font-size="36" fill="#CA8114" font-weight="700">★ ★ ★ ★ ★</text>
  </g>

  <!-- Footer bar -->
  <rect x="0" y="970" width="1080" height="110" fill="#1A1A1B"/>
  <text x="540" y="1010" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#CA8114" font-weight="700">REAL CLIENTS · REAL EMPIRES</text>
  <text x="540" y="1048" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.65">www.thebreed.co.za  ·  @breedindustries</text>
</svg>
