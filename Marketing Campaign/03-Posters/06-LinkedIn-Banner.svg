<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4D77A"/>
      <stop offset="100%" stop-color="#B68F1F"/>
    </linearGradient>
    <pattern id="lgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#lbg)"/>
  <rect width="1584" height="396" fill="url(#lgrid)"/>

  <!-- decorative -->
  <g opacity="0.4">
    <line x1="60" y1="100" x2="220" y2="100" stroke="#D4AF37" stroke-width="1"/>
    <line x1="60" y1="296" x2="220" y2="296" stroke="#D4AF37" stroke-width="1"/>
  </g>
  <circle cx="1340" cy="200" r="160" fill="#D4AF37" opacity="0.06"/>
  <circle cx="1340" cy="200" r="100" fill="#D4AF37" opacity="0.08"/>

  <g transform="translate(80, 130)" font-family="Montserrat, Arial, sans-serif">
    <text font-size="14" letter-spacing="6" fill="#D4AF37" font-weight="700">THE BREED INDUSTRIES  ·  DURBAN, SOUTH AFRICA</text>
    <text y="70" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">We register. We brand.</text>
    <text y="130" font-size="60" font-weight="800" fill="url(#lg)" letter-spacing="-1.5">We build empires.</text>
    <text y="180" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="500" fill="#FFFFFF" opacity="0.7">CIPC · SARS · Branding · Websites · Apps · AI Platforms · Funding-ready Plans</text>
    <text y="218" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600" fill="#D4AF37">www.thebreed.co.za  →  Book a strategy call</text>
  </g>

  <g transform="translate(1340, 200)">
    <circle r="110" fill="#001229" stroke="#D4AF37" stroke-width="2"/>
    <text y="-10" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="800" fill="#D4AF37" letter-spacing="3">BREED</text>
    <text y="20" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" opacity="0.7" letter-spacing="3">INDUSTRIES</text>
    <line x1="-50" y1="35" x2="50" y2="35" stroke="#D4AF37" stroke-width="0.7" opacity="0.5"/>
    <text y="55" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="9" font-weight="600" fill="#D4AF37" opacity="0.7" letter-spacing="3">EST. DURBAN</text>
  </g>
</svg>
