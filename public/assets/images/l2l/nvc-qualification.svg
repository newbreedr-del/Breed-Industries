<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background:#0B1118">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5D060;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001F3F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0B1118;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2535;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#navyGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#D4AF37" stroke-width="0.3" opacity="0.07">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
  </g>

  <!-- Ambient glow blob -->
  <ellipse cx="400" cy="300" rx="280" ry="180" fill="#D4AF37" opacity="0.04" filter="url(#softglow)"/>

  <!-- ── CERTIFICATE SCROLL (centre) ─────────────────── -->
  <rect x="180" y="140" width="440" height="310" rx="12" ry="12" fill="url(#cardGrad)" stroke="#D4AF37" stroke-width="1.5" opacity="0.9"/>
  <!-- Certificate inner border -->
  <rect x="196" y="156" width="408" height="278" rx="8" ry="8" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.3"/>
  <!-- Corner ornaments -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.5">
    <path d="M196,180 L196,156 L220,156"/>
    <path d="M580,156 L604,156 L604,180"/>
    <path d="M196,410 L196,434 L220,434"/>
    <path d="M580,434 L604,434 L604,410"/>
  </g>

  <!-- QCTO Seal (top-left of cert) -->
  <circle cx="248" cy="220" r="38" fill="#0B1118" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="248" cy="220" r="32" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="248" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#D4AF37">QCTO</text>
  <text x="248" y="229" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#D4AF37" opacity="0.8">ACCREDITED</text>

  <!-- Certificate title block -->
  <text x="400" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D4AF37" opacity="0.7" letter-spacing="3">CERTIFICATE OF ACHIEVEMENT</text>
  <line x1="310" y1="200" x2="490" y2="200" stroke="#D4AF37" stroke-width="0.6" opacity="0.4"/>

  <!-- Main qualification name -->
  <text x="400" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="white">New Venture</text>
  <text x="400" y="276" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="white">Creation</text>

  <!-- Divider line with ornament -->
  <line x1="230" y1="293" x2="370" y2="293" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
  <circle cx="400" cy="293" r="4" fill="#D4AF37" opacity="0.8"/>
  <line x1="430" y1="293" x2="570" y2="293" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

  <!-- NQF details -->
  <text x="400" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" opacity="0.9" letter-spacing="1">SAQA ID: 49648 · NQF Level 2 · 32 Credits</text>

  <!-- Issuer line -->
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.5">Delivered in partnership with</text>
  <text x="400" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#D4AF37">Kuenta Solutions (Pty) Ltd</text>

  <!-- Signature line -->
  <line x1="250" y1="415" x2="370" y2="415" stroke="white" stroke-width="0.6" opacity="0.3"/>
  <text x="310" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" opacity="0.35">Programme Director</text>
  <line x1="430" y1="415" x2="550" y2="415" stroke="white" stroke-width="0.6" opacity="0.3"/>
  <text x="490" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" opacity="0.35">Training Provider</text>

  <!-- ── GRAD CAP (top centre) ─────────────────────── -->
  <g transform="translate(400, 95)" filter="url(#glow)">
    <!-- Board -->
    <polygon points="-42,0 0,-22 42,0 0,22" fill="url(#goldGrad)"/>
    <!-- Cap top -->
    <rect x="-18" y="-30" width="36" height="28" rx="2" fill="#D4AF37"/>
    <!-- Tassel string -->
    <line x1="30" y1="0" x2="30" y2="28" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="30" cy="30" r="4" fill="#D4AF37"/>
  </g>

  <!-- ── GROWTH CHART (bottom-left) ────────────────── -->
  <g transform="translate(60, 390)" opacity="0.6">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="9" fill="#D4AF37" opacity="0.6" letter-spacing="1">BUSINESS GROWTH</text>
    <!-- Axes -->
    <line x1="0" y1="90" x2="100" y2="90" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="0" x2="0" y2="90" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <!-- Bars -->
    <rect x="8" y="60" width="14" height="30" rx="2" fill="#D4AF37" opacity="0.3"/>
    <rect x="28" y="44" width="14" height="46" rx="2" fill="#D4AF37" opacity="0.5"/>
    <rect x="48" y="28" width="14" height="62" rx="2" fill="#D4AF37" opacity="0.7"/>
    <rect x="68" y="10" width="14" height="80" rx="2" fill="#D4AF37" opacity="0.9"/>
    <!-- Trend line -->
    <polyline points="15,65 35,48 55,32 75,14" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="75" cy="14" r="3" fill="#F5D060"/>
  </g>

  <!-- ── STARS (top right) ──────────────────────────── -->
  <g fill="#D4AF37" opacity="0.7" transform="translate(640, 70)">
    <polygon points="0,-12 3,-4 12,-4 5,2 8,11 0,6 -8,11 -5,2 -12,-4 -3,-4" transform="translate(0,0) scale(0.9)"/>
    <polygon points="0,-10 2.5,-3.5 10,-3.5 4,1.5 6.5,9 0,5 -6.5,9 -4,1.5 -10,-3.5 -2.5,-3.5" transform="translate(30,10) scale(0.75)" opacity="0.5"/>
    <polygon points="0,-10 2.5,-3.5 10,-3.5 4,1.5 6.5,9 0,5 -6.5,9 -4,1.5 -10,-3.5 -2.5,-3.5" transform="translate(-24,18) scale(0.65)" opacity="0.4"/>
  </g>

  <!-- ── CONNECTING DOTS (decoration) ──────────────── -->
  <g fill="#D4AF37" opacity="0.2">
    <circle cx="90" cy="80" r="3"/>
    <circle cx="110" cy="95" r="2"/>
    <circle cx="130" cy="72" r="2.5"/>
    <circle cx="700" cy="500" r="3"/>
    <circle cx="720" cy="520" r="2"/>
    <circle cx="680" cy="515" r="2.5"/>
  </g>

  <!-- ── BOTTOM LABEL BAR ───────────────────────────── -->
  <rect x="0" y="560" width="800" height="40" fill="#D4AF37" opacity="0.08"/>
  <text x="400" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#D4AF37" opacity="0.6" letter-spacing="4">LEARNERS TO LEADERS BUSINESS DEVELOPMENT PROGRAMME</text>

  <!-- Breed Industries watermark (subtle) -->
  <text x="760" y="590" text-anchor="end" font-family="Arial, sans-serif" font-size="8" fill="white" opacity="0.2" letter-spacing="1">BREED INDUSTRIES</text>
</svg>
